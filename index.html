<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Welcome to My Website</h1>
        <p class="subtitle">Yeh ek simple single-page static website hai.</p>
        
        <!-- Image Section -->
        <div class="image-box">
            <!-- 'src' me apni image ka naam ya path dalein (jaise photo.jpg) -->
            <img src="placeholder.jpg" alt="Website Image" id="siteImage">
        </div>

        <button id="clickBtn">Click Me!</button>
    </div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>
</body>
</html>
